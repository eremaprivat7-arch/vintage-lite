<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>Vintage Lite — ключи</title>
  <link rel="stylesheet" href="/portal.css"><script src="/dashboard.js"></script><script src="/releases.js"></script>
</head>
<body><main>
  <header><div><div class="brand">VINTAGE LITE</div><h1>Панель владельца</h1></div><button id="logout" class="hidden">Выйти</button></header>
  <section id="login-panel"><h2>Вход администратора</h2><form id="login-form" class="row"><label>Пароль администратора<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Войти</button></form><div id="login-message" class="status"></div></section>
  <div id="dashboard" class="hidden">
    <div id="reports"></div><button id="refresh">Обновить статистику</button><details class="controls"><summary>Общий патч для всех версий</summary><h2 hidden>Режим патча</h2><button id="patch" disabled>Загрузка…</button><p id="patch-status" role="status"></p></details>
    <div id="release-controls"></div>
    <details class="controls" id="profiles"><summary>Добавить реселлера / настройки API</summary><form id="reseller"><label>Telegram ID<input name="uid" required pattern="[1-9][0-9]{0,15}"></label><label>Имя реселлера<input name="name" maxlength="64"></label><button value="name">Сохранить имя</button><button class="primary" value="create">Создать реселлера и API</button><div class="row"><label>1 дн. · ₸<input type="number" min="1" name="p1" value="150" required></label><label>3 дн. · ₸<input type="number" min="1" name="p3" value="420" required></label><label>7 дн. · ₸<input type="number" min="1" name="p7" value="900" required></label><label>15 дн. · ₸<input type="number" min="1" name="p15" value="2100" required></label><label>30 дн. · ₸<input type="number" min="1" name="p30" value="3000" required></label></div><button value="show" formnovalidate>Показать токен</button><button value="issue">Перевыпустить токен</button> <button value="prices">Сохранить цены</button> <button value="revoke" formnovalidate>Отключить API</button><button class="danger" value="delete" formnovalidate>Удалить реселлера</button><label>Сохранить существующий токен<input name="token" type="password" autocomplete="off"></label><button value="save-token" formnovalidate>Сохранить токен</button></form><div id="api-result" style="overflow-wrap:anywhere"></div><a href="/reseller.html">Открыть кабинет реселлера</a></details><details class="controls"><summary>Создать ключ вручную</summary><form id="create-form" class="row">
      <label>Устройств<input name="seats" type="number" min="1" max="100000" value="1" required></label>
      <label>Срок<input name="duration" type="number" min="1" max="36500" value="1" required></label>
      <label>Единицы<select name="unit"><option value="days">Дни</option><option value="hours">Часы</option></select></label>
      <label>Или дата окончания (Астана)<input name="until" type="datetime-local"></label>
      <button class="primary">Создать</button>
    </form><div id="new-key" class="hidden"></div></details><div id="notice" class="status" role="status"></div>

  </div>
</main>
<script>
const $=s=>document.querySelector(s), loginPanel=$("#login-panel"), dashboard=$("#dashboard"), notice=$("#notice");
async function api(path,options={}){const headers={"X-Requested-With":"vintage-admin",...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})};const r=await fetch(path,{credentials:"same-origin",...options,headers});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
function showError(node,error){node.textContent=error.message||String(error);node.className="status error"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function setLoggedIn(ok){loginPanel.classList.toggle("hidden",ok);dashboard.classList.toggle("hidden",!ok);$("#logout").classList.toggle("hidden",!ok)}
const loadReleases = createReleaseControls($("#release-controls"), api);
let pauseStart = null;
const patchButton = $("#patch");
patchButton.onclick = async () => {
  patchButton.disabled = true;
  try {
    await api("/admin/api/patch", { method: "POST", body: JSON.stringify({enabled: pauseStart === null}) });
    await loadKeys();
  } catch (error) { showError(notice, error); }
  finally { patchButton.disabled = false; }
};
const render=dashboardView($("#reports"),true,(path,method="GET",body)=>api("/admin/api/"+path,{method,body:body?JSON.stringify(body):undefined}),loadKeys,account=>{
  const form=$("#reseller");form.elements.uid.value=account.uid;form.elements.name.value=account.name||"";
  const prices=JSON.parse(account.prices||"{}");for(const d of [1,3,7,15,30])form.elements["p"+d].value=prices[d]??form.elements["p"+d].defaultValue;
  $("#profiles").open=true;form.elements.token.value='';$('#api-result').textContent='';form.elements.name.focus()
});
async function loadKeys(){
const data=await api("/admin/api/report");pauseStart=data.started;render(data);
patchButton.textContent=pauseStart===null?"Включить патч":"Завершить патч";
$("#patch-status").textContent=pauseStart===null?"Вход открыт":"Вход закрыт. Сроки ключей приостановлены.";
patchButton.disabled=false;
await loadReleases();
}
$("#login-form").addEventListener("submit",async e=>{e.preventDefault();const msg=$("#login-message");msg.textContent="";try{await api("/admin/api/login",{method:"POST",body:JSON.stringify({password:$("#password").value})});$("#password").value="";setLoggedIn(true);await loadKeys()}catch(err){showError(msg,err)}});
$("#create-form").addEventListener("submit",async e=>{e.preventDefault();notice.textContent="";const f=new FormData(e.currentTarget),until=f.get("until");const payload={seats:Number(f.get("seats")),duration:Number(f.get("duration")),unit:f.get("unit"),until:until?`${until}:00+05:00`:""};try{const result=await api("/admin/api/keys",{method:"POST",body:JSON.stringify(payload)});const box=$("#new-key");box.classList.remove("hidden");box.innerHTML=`<div class="success">Ключ создан.</div><code class="key">${esc(result.key)}</code><button id="copy-key">Скопировать</button>`;$("#copy-key").onclick=()=>navigator.clipboard.writeText(result.key);notice.textContent="Ключ создан.";notice.className="status success";await loadKeys()}catch(err){showError(notice,err)}});
$("#refresh").onclick=()=>loadKeys().catch(err=>showError(notice,err));
$("#logout").onclick=async()=>{try{await api("/admin/api/logout",{method:"POST"})}finally{setLoggedIn(false)}};
loadKeys().then(()=>setLoggedIn(true)).catch(error=>{setLoggedIn(false);if(error.message!=="unauthorized")showError($("#login-message"),error)});
$("#reseller").onsubmit=async e=>{
  e.preventDefault();const form=new FormData(e.currentTarget),action=e.submitter.value;
  if(action==='delete' && !confirm('Удалить реселлера и отключить его API? Баланс и история сохранятся.'))return;
  if(action==='issue' && !confirm('Выпустить новый токен? Предыдущий токен этого ID перестанет работать.'))return;
  const prices=Object.fromEntries([1,3,7,15,30].map(d=>[d,Number(form.get('p'+d))]));
  try{
    const uid=form.get('uid').trim(),name=form.get('name').trim();
    if(action==='name'){await api('/admin/api/profile',{method:'POST',body:JSON.stringify({uid,name})});$('#api-result').textContent='Имя сохранено';await loadKeys();return}
    const r=await api('/admin/api/reseller',{method:'POST',body:JSON.stringify({uid:form.get('uid').trim(),prices,action,name,token:form.get('token').trim()})});$('#api-result').textContent=r.token?'Скопируй и передай реселлеру: '+r.token:r.message; if(action==='issue' && name)await api('/admin/api/profile',{method:'POST',body:JSON.stringify({uid,name})});await loadKeys()}
  catch(err){$('#api-result').textContent=err.message}
};
</script></body></html>
