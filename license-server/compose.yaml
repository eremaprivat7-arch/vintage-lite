services:
  api:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      LICENSE_DB: /data/licenses.db
    volumes: [licenses:/data]
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      LICENSE_DOMAIN: ${LICENSE_DOMAIN:?Set LICENSE_DOMAIN}
    ports: ["80:80","443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro","certificates:/data"]
volumes:
  licenses:
  certificates:
