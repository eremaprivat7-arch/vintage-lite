name: Build VintageLite Protected IPA
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check migration and upstream policies
        run: |
          python3 Tests/check_private_release.py
          node --experimental-sqlite Tests/private_content.test.mjs
          bash Tests/run_policy_tests.sh
      - name: Build for iPhone
        run: |
          xcodebuild -project ThreeOneOSSix.xcodeproj -target 3106 \
            -configuration Release -sdk iphoneos ARCHS=arm64 \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/products" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Check built license configuration
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/products/3106.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/products/3106.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/products/3106.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LicenseServerURL' "$RUNNER_TEMP/products/3106.app/Info.plist"
          python3 Tests/check_private_release.py "$RUNNER_TEMP/products/3106.app"
          xcrun strip -S -x "$RUNNER_TEMP/products/3106.app/3106"
      - name: Package IPA
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          ditto products/3106.app Payload/3106.app
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VintageLite-Protected-2.1.0-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VintageLite-Protected-2.1.0-unsigned
          path: VintageLite-Protected-2.1.0-unsigned.ipa
          if-no-files-found: error
